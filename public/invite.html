<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centry — Приглашение в план</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      h1 { font-size: 22px; margin-bottom: 12px; color: #fff; }
      p { font-size: 15px; line-height: 1.5; color: #aaa; margin-bottom: 20px; }
      .btn {
        display: block;
        width: 100%;
        padding: 14px 32px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        margin-bottom: 10px;
      }
      .btn-primary { background: #fff; color: #121212; }
      .btn-store {
        background: transparent;
        color: #ccc;
        border: 1px solid #444;
        font-size: 14px;
      }
      .stores { display: none; margin-top: 8px; }
      .stores.visible { display: block; }
      .hint { font-size: 12px; color: #555; margin-top: 16px; line-height: 1.5; }
      .copied { font-size: 12px; color: #4ade80; margin-top: 8px; display: none; }
      .copied.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Приглашение в план</h1>
      <p>Вас пригласили присоединиться к плану в Centry.</p>

      <a id="open-btn" class="btn btn-primary" href="#">Открыть в приложении</a>

      <div id="stores" class="stores">
        <a id="link-appstore" class="btn btn-store" href="https://apps.apple.com/app/id6761648930" style="display:none;">App Store</a>
        <a id="link-google"   class="btn btn-store" href="https://play.google.com/store/apps/details?id=com.centry.mobile.app" style="display:none;">Google Play</a>
        <a id="link-rustore"  class="btn btn-store" href="https://apps.rustore.ru/app/com.centry.mobile.app" style="display:none;">RuStore</a>
      </div>

      <div id="copied" class="copied">Ссылка скопирована — после установки приложение автоматически подхватит приглашение</div>
      <div id="hint" class="hint" style="display:none;">После установки откройте приложение — оно автоматически найдёт приглашение.</div>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token') || params.get('plan_invite_token') || params.get('invite_token') || '';

        var deepLink = 'centry://plan-invite' + (token ? '?token=' + encodeURIComponent(token) : '');
        var fullUrl = window.location.href;

        // Кнопка "Открыть в приложении"
        document.getElementById('open-btn').href = deepLink;

        // Копируем полный URL в clipboard (deferred deep link для установки из стора)
        if (token && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(fullUrl).then(function () {
            document.getElementById('copied').classList.add('visible');
          }).catch(function () {});
        }

        // Определяем платформу → показываем нужные кнопки стора
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var storesDiv = document.getElementById('stores');

        if (isIOS) {
          document.getElementById('link-appstore').style.display = '';
          storesDiv.classList.add('visible');
        } else if (isAndroid) {
          document.getElementById('link-google').style.display = '';
          document.getElementById('link-rustore').style.display = '';
          storesDiv.classList.add('visible');
        }

        if (storesDiv.classList.contains('visible')) {
          document.getElementById('hint').style.display = '';
        }

        // Пробуем открыть приложение сразу
        if (token) window.location.href = deepLink;
      })();
    </script>
  </body>
</html>
