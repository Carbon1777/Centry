<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centry — Приглашение в план</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      h1 { font-size: 22px; margin-bottom: 12px; color: #fff; }
      p { font-size: 15px; line-height: 1.5; color: #aaa; margin-bottom: 20px; }
      .btn {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .btn-primary {
        background: #4CAF50;
        color: #fff;
        margin-bottom: 12px;
      }
      .btn-secondary {
        background: transparent;
        color: #aaa;
        border: 1px solid #444;
      }
      .hint { font-size: 13px; color: #666; margin-top: 20px; }
    </style>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (!token) return;

        // Build deep link URI with custom scheme
        var deepLink = 'centry://plan-invite?token=' + encodeURIComponent(token);

        // Try to open the app via custom URL scheme
        var start = Date.now();
        window.location.href = deepLink;

        // If we're still here after 1.5s, the app didn't open — show the page
        setTimeout(function () {
          // If the page was hidden (app opened), do nothing
          if (document.hidden) return;
          // Otherwise the app is not installed or didn't respond
          var fallback = document.getElementById('fallback');
          if (fallback) fallback.style.display = 'block';
        }, 1500);
      })();
    </script>
  </head>
  <body>
    <div class="card" id="fallback">
      <h1>Приглашение в план</h1>
      <p>
        Если приложение Centry установлено — оно откроется автоматически.
      </p>
      <a id="open-btn" class="btn btn-primary" href="#">Открыть в Centry</a>
      <br />
      <p class="hint">
        Если приложение не установлено — установите его и откройте ссылку снова.
      </p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (!token) return;

        var deepLink = 'centry://plan-invite?token=' + encodeURIComponent(token);
        var btn = document.getElementById('open-btn');
        if (btn) btn.href = deepLink;
      })();
    </script>
  </body>
</html>
